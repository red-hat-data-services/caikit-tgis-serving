name: "Update poetry lockfiles"

on:
  schedule:
    - cron: "20 4 * * 1" # once a week
  workflow_dispatch:

jobs:
  poetry-update:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install poetry
        run: |
          pip install --upgrade pip
          # Pinned: a floating poetry upgrade once broke this workflow because
          # newer poetry rejected the lockfile format. Bump deliberately.
          pip install poetry==2.5.1

      - name: Setup virtualenv
        run: |
          # --no-root: the root package declares readme = "README.md" and is
          # never needed here, we only run `poetry update` against the
          # dependency set. Installing the root package fails the whole run
          # when a packaging-only file is missing.
          poetry install --no-root

      - name: Refresh poetry lock files
        id: poetry-update
        # shell: bash enables `-eo pipefail`, so a failing `poetry update`
        # fails the job instead of being masked by the `tee` in the pipeline.
        shell: bash
        run: |
          # Update only the packages listed in .github/poetry-update-packages.txt.
          # A bare `poetry update` floats every transitive dependency, which
          # produced a 93-package, 25-new-package pull request with protobuf
          # moving from 4 to 6. Packages outside the list are bumped on purpose.
          list=.github/poetry-update-packages.txt
          if [ ! -r "$list" ]; then
            echo "::error::$list is missing or unreadable; refusing to run an unrestricted poetry update"
            exit 1
          fi
          # An empty list would expand to `poetry update` with no arguments,
          # which is exactly the unrestricted update this workflow avoids.
          mapfile -t packages < <(sed -e 's/#.*//' "$list" | tr -d '\r' | awk 'NF { print $1 }')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::$list contains no package names; refusing to run an unrestricted poetry update"
            exit 1
          fi
          # Capture first, then write the heredoc. A process substitution can
          # still be writing to $GITHUB_OUTPUT when the terminator lands, and
          # the runner rejects a trailing line after the delimiter.
          log="$(mktemp)"
          poetry update "${packages[@]}" | tee "$log"
          {
            echo 'log<<EOF'
            cat "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f "$log"

      - name: Check diff
        id: diff
        shell: bash
        run: |
          git status --untracked-files=all
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          git diff >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create PR
        if: ${{ steps.diff.outputs.diff != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: update dependencies
          title: update dependencies
          labels: |
            dependencies
            ok-to-test
          body: |
            Update dependencies using `poetry update` on the packages listed in
            `.github/poetry-update-packages.txt`. Packages outside that list are
            upgraded deliberately.

            ```console
            ${{ steps.poetry-update.outputs.log }}
            ```
